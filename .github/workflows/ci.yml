name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feature/phase-b-i3a-r-provenance]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Backend typecheck
        run: npm run typecheck --workspace backend

      - name: Backend tests
        run: npm run test --workspace backend
        env:
          # Safe placeholders: tests must never depend on production credentials, but modules
          # that exercise the real application graph validate required configuration on import.
          FRONTEND_URL: http://localhost:5173
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          PLAID_CLIENT_ID: test-client-id
          PLAID_SECRET: test-secret

      - name: Backend build
        run: npm run build --workspace backend

      - name: Frontend typecheck
        run: npm run typecheck --workspace frontend

      - name: Frontend tests
        run: npm run test --workspace frontend

      - name: Frontend build
        run: npm run build --workspace frontend

      - name: Frontend PWA build contract
        run: npm run verify:pwa --workspace frontend

  migration-replay:
    # The tracked migration history must rebuild through the supported Supabase workflow (post-audit
    # blocker 3): the pipeline emulator plus the real, pinned CLI's `db push` and `db reset`, each
    # against throwaway local databases only. See supabase/tests/replay/run.sh.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The harness reads the Phase A file as production applied it from an earlier commit.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Pinned by commit (v3.0.0); CLI version pinned to the one used for the production rollout.
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520
        with:
          version: 2.117.0

      - name: Replay every migration (emulator, CLI db push, CLI db reset)
        run: bash supabase/tests/replay/run.sh
        env:
          SUPABASE_CLI: supabase

  database-harness:
    # The adversarial PostgreSQL suites behind the manual-loan and Plaid-link database code: Phase A
    # (scaffold and history modes, which include the post-audit t07/t08, c07/c08 and g06/g07 tests),
    # access_control, the card-payment SQL-evaluator equivalence check (SQL vs the TypeScript
    # reference evaluator), and the three card-payment recovery checks. Throwaway local containers
    # only. Each suite runs even if an earlier one failed, so one run reports all of them.
    runs-on: ubuntu-latest
    env:
      # Supabase's PostgreSQL 17.6.1.155 from ECR Public, after Docker Hub rejected CI pulls (pull limit).
      # The SAME index digest as before: no database-image change. An earlier revision had moved to Docker
      # Hub because of ECR Public's anonymous-download quota, so this is an alternative, not a guarantee.
      # History, access-control and evaluator suites use this image; scaffold keeps standard PostgreSQL.
      SUPABASE_TEST_PG_IMAGE: public.ecr.aws/supabase/postgres@sha256:3866d94d8426927e8db3f1c5d790752292bfbe27b5f1f46e199ae1b7d3c1710b
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Phase A's classifier tests call the real backend build.
      - run: npm install

      - name: Phase A (scaffold)
        run: bash supabase/tests/phase_a/run.sh
        env:
          # Standard PostgreSQL 17 (the Docker Official Image) from its ECR Public mirror, not the Supabase
          # image. Pinned to the index that postgres:17 named on 2026-10-09, byte-identical on Docker Hub
          # and on ECR Public. Until then this step pulled the moving tag postgres:17 from Docker Hub.
          PG_IMAGE: public.ecr.aws/docker/library/postgres@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3

      - name: Phase A (history)
        if: ${{ !cancelled() }}
        run: bash supabase/tests/phase_a/run.sh
        env:
          PHASE_A_BASE: history
          PG_IMAGE: ${{ env.SUPABASE_TEST_PG_IMAGE }}

      - name: access_control
        if: ${{ !cancelled() }}
        run: bash supabase/tests/access_control/run.sh
        env:
          PG_IMAGE: ${{ env.SUPABASE_TEST_PG_IMAGE }}

      # Any difference between the SQL evaluator and the TypeScript oracle, or any rule path the
      # fixtures fail to reach, exits non-zero and fails this step.
      - name: card-payment evaluator equivalence
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        run: bash supabase/tests/card_payment_evaluator/run.sh
        env:
          PG_IMAGE: ${{ env.SUPABASE_TEST_PG_IMAGE }}

      - name: Recovery SQL, concurrency, and reference
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        working-directory: .
        run: bash supabase/tests/card_payment_recovery_review/run.sh
        env:
          PG_IMAGE: ${{ env.SUPABASE_TEST_PG_IMAGE }}
          LOGDIR: ${{ runner.temp }}/packet-2a/recovery
          REFERENCE: "1"

      - name: Recovery rollback and reapply
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        working-directory: .
        run: bash supabase/tests/card_payment_recovery_review/rehearsal.sh
        env:
          PG_IMAGE: ${{ env.SUPABASE_TEST_PG_IMAGE }}
          LOGDIR: ${{ runner.temp }}/packet-2a/rehearsal

      - name: Recovery RPC metadata controls
        if: ${{ !cancelled() }}
        timeout-minutes: 20
        shell: bash
        working-directory: .
        run: bash supabase/tests/card_payment_recovery_review/rpc_metadata_controls.sh
        env:
          PG_IMAGE: ${{ env.SUPABASE_TEST_PG_IMAGE }}
          LOGDIR: ${{ runner.temp }}/packet-2a/rpc-metadata
